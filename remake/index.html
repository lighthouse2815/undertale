<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<title>Undertale — bản viết lại</title>
<main>
  <div id="game" aria-label="Màn hình Undertale"></div>
  <p id="status" role="status" aria-live="polite">Đang tải phòng…</p>
  <nav class="touch" aria-label="Điều khiển cảm ứng">
    <div class="arrows">
      <button data-direction="up" aria-label="Lên">▲</button>
      <button data-direction="left" aria-label="Trái">◀</button>
      <button data-direction="down" aria-label="Xuống">▼</button>
      <button data-direction="right" aria-label="Phải">▶</button>
    </div>
  </nav>
  <footer>↑ ↓ ← → di chuyển · Z xác nhận · X quay lại · C menu · <button id="fullscreen">Toàn màn hình</button></footer>
</main>
<noscript>Trò chơi cần JavaScript để chạy.</noscript>
<script type="module" src="./src/main.mjs"></script>
</html>
