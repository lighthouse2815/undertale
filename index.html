<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Undertale — bản chạy web của dự án, sử dụng dữ liệu và logic trò chơi gốc." />
  <link rel="icon" href="data:," />
  <title>UNDERTALE</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./src/undertale.css" />
</head>
<body class="original-game">
  <main id="app">
    <div id="frame">
      <div id="stage">
        <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Màn hình trò chơi Undertale"></canvas>
        <div id="boot" class="boot has-logo">
          <img class="boot-logo" src="./assets/sprites/spr_undertaletitle_0.png" alt="Undertale" />
          <div class="boot-inner">
            <button id="bootBtn" type="button" disabled>ĐANG TẢI…</button>
            <progress id="loadProgress" max="1" value="0" aria-label="Tiến độ tải trò chơi"></progress>
            <p id="loadStatus" role="status" aria-live="polite">Đang chuẩn bị trò chơi…</p>
          </div>
        </div>
        <div class="touch" aria-label="Điều khiển cảm ứng">
          <div class="dpad">
            <button class="tbtn up" data-key="38" aria-label="Lên">▲</button>
            <button class="tbtn left" data-key="37" aria-label="Trái">◀</button>
            <button class="tbtn down" data-key="40" aria-label="Xuống">▼</button>
            <button class="tbtn right" data-key="39" aria-label="Phải">▶</button>
          </div>
          <div class="tactions">
            <button class="tbtn round" data-key="67" aria-label="Menu">C</button>
            <button class="tbtn round b" data-key="88" aria-label="Hủy hoặc bỏ qua chữ">X</button>
            <button class="tbtn round a" data-key="90" aria-label="Xác nhận">Z</button>
          </div>
        </div>
      </div>
      <footer class="game-toolbar">
        <span>↑ ↓ ← → · Z chọn · X hủy · C menu</span>
        <button id="fullscreenBtn" type="button">Toàn màn hình</button>
        <a href="./duoi-dat.html">Dưới Đất</a>
        <a href="./game/README.md">Mã nguồn</a>
      </footer>
    </div>
  </main>
  <noscript>Trò chơi cần JavaScript để chạy.</noscript>
  <script type="module" src="./src/undertale.js"></script>
</body>
</html>
